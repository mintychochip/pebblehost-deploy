name: Deploy to PebbleHost

on:
  workflow_call:
    inputs:
      restart:
        description: Restart servers after upload
        type: boolean
        required: false
        default: true
      rollback:
        description: Rollback policy on failure (abort|restore)
        type: string
        required: false
        default: abort
      continue-after-canary:
        description: Proceed past the canary group
        type: boolean
        required: false
        default: false
    secrets:
      PEBBLEHOST_API_TOKEN:
        description: PebbleHost client API token
        required: true
  workflow_dispatch:
    inputs:
      restart:
        description: Restart servers after upload
        type: boolean
        default: true
      rollback:
        description: Rollback policy on failure (abort|restore)
        type: choice
        options: [abort, restore]
        default: abort
      continue-after-canary:
        description: Proceed past the canary group
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@v7
        with:
          repository: mintychochip/pebblehost-cli
          ref: feat/file-push-restored
          path: .pebblehost-cli
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build pb
        working-directory: .pebblehost-cli
        run: cargo build --release
      - name: Install pb
        run: install -m 0755 .pebblehost-cli/target/release/pb "$HOME/.local/bin/pb"
      - name: Verify pb file push
        run: pb file --help | grep -q 'push'
      - name: Build
        run: ./gradlew build
      - name: Deploy
        env:
          PEBBLEHOST_API_TOKEN: ${{ secrets.PEBBLEHOST_API_TOKEN }}
        run: ./gradlew :test-plugin:deployPebbleHost --deploy-restart=${{ inputs.restart }} --deploy-rollback=${{ inputs.rollback }} --continue-after-canary=${{ inputs.continue-after-canary }}
